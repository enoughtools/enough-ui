<script>
  // Catalog embeds are self-contained. Register before Storybook's manager
  // channel, which expects a single preview rather than a grid of previews.
  window.addEventListener('message', function (event) {
    if (!new URLSearchParams(location.search).get('path')?.startsWith('/catalog')) return;
    try {
      const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (data?.key === 'storybook-channel') event.stopImmediatePropagation();
    } catch {}
  }, true);
  if (location.pathname === '/swift' || location.pathname === '/swift/') {
    const url = new URL(location.href);
    if (!url.searchParams.get('path')?.startsWith('/swift')) url.searchParams.set('path', '/swift/');
    history.replaceState(null, '', url);
  } else if (!new URLSearchParams(location.search).has('path') || new URLSearchParams(location.search).get('path') === '/catalog') {
    const url = new URL(location.href);
    url.searchParams.set('path', '/catalog/');
    history.replaceState(null, '', url);
  }
</script>
