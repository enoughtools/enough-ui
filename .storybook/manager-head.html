<meta name="description" content="Explore EnoughUI components for React and Astro. Search the catalog, try live examples, and inspect the source.">
<meta name="theme-color" content="#f4f5f8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2312151c' d='M0 0h32v32H0z'/%3E%3Ctext x='6' y='24' fill='white' font-family='Arial,sans-serif' font-size='26' font-weight='bold'%3Ee.%3C/text%3E%3C/svg%3E">
<script>
  // Catalog embeds are self-contained. Register before Storybook's manager
  // channel, which expects a single preview rather than a grid of previews.
  window.addEventListener('message', function (event) {
    if (!new URLSearchParams(location.search).get('path')?.startsWith('/catalog')) return;
    try {
      const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (data?.key === 'storybook-channel') event.stopImmediatePropagation();
    } catch {}
  }, true);
  if (!new URLSearchParams(location.search).has('path') || new URLSearchParams(location.search).get('path') === '/catalog') {
    const url = new URL(location.href);
    url.searchParams.set('path', '/catalog/');
    history.replaceState(null, '', url);
  }
</script>
