name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build both renderer packages
        run: pnpm build
      - name: Check React and story types
        run: pnpm typecheck
      - name: Check native Astro components
        run: pnpm check:astro
      - name: Run component and story rendering tests
        run: pnpm test
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the shared Storybook catalog
        run: pnpm build-storybook
      - name: Verify component preview images
        run: pnpm verify:previews
      - name: Verify isolated packed consumers
        run: pnpm verify:package
      - name: Verify Storybook rendering, accessibility, and interactions
        run: pnpm verify:stories
      - name: Verify catalog navigation and controls
        run: pnpm verify:catalog
      - name: Verify browser behavior from installed packages
        run: pnpm verify:browser
