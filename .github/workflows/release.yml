name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize renderer pairs so overlapping releases cannot race dist-tags.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'enoughtools/enough-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build both renderer packages
        run: pnpm build
      - name: Validate tag and package metadata
        run: node scripts/release.mjs check
      - name: Check React and story types
        run: pnpm typecheck
      - name: Check native Astro components
        run: pnpm check:astro
      - name: Run component, story, and release policy tests
        run: pnpm test
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the shared Storybook catalog
        run: pnpm build-storybook
      - name: Verify the Swift gallery
        run: pnpm verify:swift-gallery
      - name: Verify component preview images
        run: pnpm verify:previews
      - name: Pack the release archives
        run: node scripts/release.mjs pack
      - name: Verify the exact archives in isolated consumers
        run: pnpm verify:package --archives artifacts/release
      - name: Verify Storybook rendering, accessibility, and interactions
        run: pnpm verify:stories
      - name: Verify catalog navigation and controls
        run: pnpm verify:catalog
      - name: Verify browser behavior from the release archives
        run: pnpm verify:browser --archives artifacts/release
      - name: Save verified archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify-swift:
    uses: ./.github/workflows/swift.yml

  publish:
    needs: [verify, verify-swift]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Restore the verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.ref_name }}
          path: artifacts/release/
      - name: Publish both renderers with OIDC and provenance
        run: node scripts/release.mjs publish

  github-release:
    needs: [publish, verify-swift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-release-${{ github.sha }}
          path: artifacts/swift-release
      - name: Create the shared release and attach verified Swift sources
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${args[@]}"
          fi
          # Preserve already-published assets; retries must match their bytes.
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          downloaded=$(mktemp -d)
          for file in artifacts/swift-release/*; do
            name=$(basename "$file")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$downloaded"
              cmp "$file" "$downloaded/$name"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
